<!-- Home/Library/Explore-only in-page player: an overlay (full "now playing"
     view) plus a persistent mini-bar that stays visible while it's
     collapsed. Reuses player.html's exact markup/ids so player.js's
     setupPlayer/prepareAudio/setupMediaSession/setupFavorite work against it
     unmodified — safe since index.html and player.html are never the same
     document. Starts with an empty #player-root dataset (nothing loaded
     until a track is actually opened, see app.js's openPlayer), unlike
     player.html where Jinja fills it in server-side. -->
<div id="player-overlay" class="player-overlay" hidden>
  <div class="player-card" id="player-root" data-content-id="" data-status="" data-stream="">
    <button type="button" class="back-link" id="overlay-collapse-btn" aria-label="Collapse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
      Collapse
    </button>

    <div class="player-art">
      <img id="player-art-img" alt="" hidden />
    </div>

    <div class="player-meta">
      <h1 class="player-title"></h1>
      <p class="player-channel"></p>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <div id="prepare-state" class="prepare-state" hidden>
      <span class="spinner" role="status"></span>
      <span id="prepare-text">Preparing audio…</span>
    </div>

    <div class="progress-block">
      <input type="range" id="seek-bar" class="range" min="0" max="100" step="0.1" value="0" aria-label="Seek" />
      <div class="progress-times">
        <span id="current-time">0:00</span>
        <span id="duration-time">0:00</span>
      </div>
    </div>

    <div class="transport">
      <button type="button" id="back15" class="btn-transport" aria-label="Back 15 seconds">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a8 8 0 1 1-7.5 5.2"></path><path d="M3 3v5h5"></path></svg>
        <span class="transport-num">15</span>
      </button>

      <button type="button" id="play-pause" class="btn-play-main" aria-label="Play">
        <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path></svg>
      </button>

      <button type="button" id="fwd15" class="btn-transport" aria-label="Forward 15 seconds">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4a8 8 0 1 0 7.5 5.2"></path><path d="M21 3v5h-5"></path></svg>
        <span class="transport-num">15</span>
      </button>
    </div>

    <div class="player-footer">
      <div class="volume-group">
        <button type="button" id="mute-btn" class="btn-quiet-icon" aria-label="Mute">
          <svg id="icon-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 6a9 9 0 0 1 0 12"></path></svg>
          <svg id="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"></path><path d="M16 9.5l5 5"></path><path d="M21 9.5l-5 5"></path></svg>
        </button>
        <input type="range" id="volume-bar" class="range range-volume" min="0" max="100" value="100" aria-label="Volume" />
      </div>

      <button
        type="button"
        id="favorite-btn"
        class="btn-fav"
        data-content-id=""
        data-favorite="false"
        aria-pressed="false"
        aria-label="Favorite"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7.5-4.7-9.4-9A5.3 5.3 0 0 1 12 6.6 5.3 5.3 0 0 1 21.4 12c-1.9 4.3-9.4 9-9.4 9z"></path></svg>
      </button>
    </div>
  </div>
</div>

<div id="mini-player" class="mini-player" hidden>
  <div class="mini-player-progress">
    <div id="mini-player-progress-fill" class="mini-player-progress-fill"></div>
  </div>
  <div class="mini-player-bar">
    <button type="button" id="mini-player-expand" class="mini-player-info" aria-label="Expand player">
      <span class="mini-player-thumb">
        <img id="mini-player-art-img" alt="" hidden />
      </span>
      <span class="mini-player-text">
        <span id="mini-player-title" class="mini-player-title"></span>
        <span id="mini-player-channel" class="mini-player-channel"></span>
      </span>
    </button>
    <button type="button" id="mini-player-playpause" class="mini-player-playpause" aria-label="Play">
      <svg id="mini-icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
      <svg id="mini-icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path></svg>
    </button>
    <button type="button" id="mini-player-close" class="mini-player-close" aria-label="Close player">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
</div>
