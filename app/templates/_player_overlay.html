<!-- Home/Library/Explore's in-page player: an overlay (full "now playing"
     view) plus a persistent mini-bar that stays visible while it's
     collapsed. The controls themselves come from _player_controls.html —
     see its header for why the element ids are bound directly. Starts
     with an empty #player-root dataset; nothing is loaded until a track
     is actually opened (see home/overlay.js's openPlayer), which fills it
     in client-side. -->
<div id="player-overlay" class="player-overlay" hidden>
  <div class="player-card" id="player-root" data-content-id="" data-status="" data-stream="">
    <button type="button" class="back-link" id="overlay-collapse-btn" aria-label="Collapse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-arrow-left" /></svg>
      Collapse
    </button>

    <div class="player-art">
      <img id="player-art-img" alt="" hidden />
    </div>

    <div class="player-meta">
      <h1 class="player-title"></h1>
      <p class="player-channel"></p>
    </div>
{% with duration_label = '0:00', favorite_content_id = '', favorite_is_on = False %}
{% include "_player_controls.html" %}
{% endwith %}

    <!-- Starts empty and closed. The queue lives in the browser, so there is
         nothing to render here until the panel is opened and home/overlay.js
         fetches /partials/queue with the ids it holds.

         Closed by a class rather than `hidden`, and wrapped: `display: none`
         has nothing to animate between, so the panel is a grid collapsed to
         0fr and the wrapper is what clips its contents on the way. The
         border and padding live on the body inside that wrapper so they are
         clipped too — left on the panel they'd draw a stray line under the
         controls with nothing beneath it. -->
    <div id="queue-panel" class="queue-panel">
      <div class="queue-panel-inner">
        <div id="queue-panel-body"></div>
      </div>
    </div>
  </div>
</div>

<div id="mini-player" class="mini-player" hidden>
  <!-- A button, not a bare div: on desktop this bar is the player most of the
       time, and a progress line you cannot scrub is a line, not a control.
       role/aria-* describe it as a slider so it is operable from the keyboard
       too; home/overlay.js keeps the values in step. -->
  <button
    type="button"
    id="mini-player-progress"
    class="mini-player-progress"
    role="slider"
    aria-label="Seek"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="0"
  >
    <span id="mini-player-progress-fill" class="mini-player-progress-fill"></span>
  </button>
  <div class="mini-player-bar">
    <button type="button" id="mini-player-expand" class="mini-player-info" aria-label="Expand player">
      <span class="mini-player-thumb">
        <img id="mini-player-art-img" alt="" hidden />
      </span>
      <span class="mini-player-text">
        <span id="mini-player-title" class="mini-player-title"></span>
        <span id="mini-player-channel" class="mini-player-channel"></span>
      </span>
    </button>

    <!-- The transport. Previous is desktop-only (see style.css): on a phone
         the bar has no width to spare for it, and the full overlay is one tap
         away. Previous/next are both only shown while a queue is loaded —
         with a single track open there is nothing to skip to, and a
         permanently dead control is worse than none. -->
    <div class="mini-player-transport">
      <button type="button" id="mini-player-prev" class="mini-player-skip" aria-label="Previous track" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#i-skip-previous" /></svg>
      </button>
      <button type="button" id="mini-player-playpause" class="mini-player-playpause" aria-label="Play">
        <svg id="mini-icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#i-play" /></svg>
        <svg id="mini-icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><use href="#i-pause" /></svg>
      </button>
      <button type="button" id="mini-player-next" class="mini-player-skip" aria-label="Next track" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#i-skip-next" /></svg>
      </button>
    </div>

    <div class="mini-player-actions">
      <span id="mini-player-time" class="mini-player-time"></span>
      <button type="button" id="mini-player-close" class="mini-player-close" aria-label="Close player">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-close" /></svg>
      </button>
    </div>
  </div>
</div>
