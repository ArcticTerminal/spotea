{% extends "_base.html" %}
{% set body_class = "login-body" %}

{% block title %}Spotea — Login{% endblock %}

{% block body %}
  <main class="login-card">
    <h1 class="brand"><img src="/static/img/logo.svg" alt="" class="brand-logo" />Spotea</h1>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" autofocus required />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />
      <button type="submit">Log in</button>
    </form>
    <p class="login-alt-action"><a href="/register">Don't have an account? Register</a></p>
  </main>
{% endblock %}
