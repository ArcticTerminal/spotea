<!doctype html>
<html lang="en" style="background: #121212">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <title>Spotea — Register</title>
  <link rel="icon" href="/static/img/favicon.ico" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spotea" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <h1 class="brand"><img src="/static/img/logo.svg" alt="" class="brand-logo" />Spotea</h1>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/register">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" autofocus required />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="8" maxlength="72" />
      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="8" maxlength="72" />
      <button type="submit">Register</button>
    </form>
    <p class="login-alt-action"><a href="/login">Already have an account? Log in</a></p>
  </main>
</body>
</html>
