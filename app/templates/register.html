{% extends "_base.html" %}
{% set body_class = "login-body" %}

{% block title %}Spotea — Register{% endblock %}

{% block body %}
  <main class="login-card">
    <h1 class="brand"><img src="/static/img/logo.svg" alt="" class="brand-logo" />Spotea</h1>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/register">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" autofocus required />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="8" maxlength="72" />
      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="8" maxlength="72" />
      <button type="submit">Register</button>
    </form>
    <p class="login-alt-action"><a href="/login">Already have an account? Log in</a></p>
  </main>
{% endblock %}
